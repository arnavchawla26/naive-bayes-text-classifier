[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naive-bayes-text-classifier"
version = "0.1.0"
description = "A dependency-free multinomial Naive Bayes text classifier, from scratch in pure Python."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Arnav Chawla" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
nbtext = "nbtext.cli:main"

[tool.setuptools.packages.find]
include = ["nbtext*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
